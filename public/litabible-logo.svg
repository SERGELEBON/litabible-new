<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" role="img" aria-label="LitaBible">
  <defs>
    <linearGradient id="heartgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7c66"/>
      <stop offset="100%" stop-color="#0a5e4d"/>
    </linearGradient>
  </defs>
  <!-- Heart + open book mark -->
  <g transform="translate(4,6)">
    <!-- Open book (gold pages) -->
    <path d="M2 30 Q2 22 10 22 L20 24 L20 34 L10 32 Q2 32 2 30 Z" fill="#c9a444" opacity="0.95"/>
    <path d="M38 30 Q38 22 30 22 L20 24 L20 34 L30 32 Q38 32 38 30 Z" fill="#c9a444" opacity="0.95"/>
    <path d="M20 24 L20 34" stroke="#0a5e4d" stroke-width="1.2" fill="none"/>
    <!-- Heart above the book -->
    <path d="M20 26 C20 16 6 10 4 18 C2 24 12 30 20 36 C28 30 38 24 36 18 C34 10 20 16 20 26 Z" fill="url(#heartgrad)"/>
  </g>
  <!-- Wordmark LitaBible -->
  <text x="50" y="40" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="26" letter-spacing="0.5" fill="#0e7c66">Lita<tspan fill="#2d2d2d" font-weight="600">Bible</tspan></text>
</svg>
