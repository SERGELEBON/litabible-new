<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" role="img" aria-label="LitaBible">
  <!-- Open book (yellow pages) -->
  <g transform="translate(4,8)">
    <path d="M2 30 Q2 22 10 22 L20 24 L20 34 L10 32 Q2 32 2 30 Z" fill="#f5c400" stroke="#ffffff" stroke-width="0.8"/>
    <path d="M38 30 Q38 22 30 22 L20 24 L20 34 L30 32 Q38 32 38 30 Z" fill="#f5c400" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="20" y1="24" x2="20" y2="34" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Heart (white) above the book — visible on blue header -->
    <path d="M20 24 C20 14 6 8 4 16 C2 22 12 28 20 34 C28 28 38 22 36 16 C34 8 20 14 20 24 Z" fill="#ffffff"/>
  </g>
  <!-- Wordmark LitaBible (white on blue header) -->
  <text x="50" y="40" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="26" letter-spacing="0.5" fill="#ffffff">Lita<tspan fill="#f5c400" font-weight="600">Bible</tspan></text>
</svg>
